                <h4>Dúvidas frequentes</h4>

                <p>

        `
            },
            {
                titulo: "Boas-vindas!",
                classe: "pagina-boas-vindas",
                conteudo: `
            <div class="boas-vindas-texto-continuo" aria-labelledby="pagina-titulo">
                <h3 id="pagina-titulo">BOAS-VINDAS!</h3>

                <h4>Seja muito bem-vindo(a)!</h4>

                <p>

                </p>

                <p>

                <p>

            },
            {
                titulo: "Conhecendo o Módulo",
                classe: "pagina-conhecendo-modulo",
                conteudo: `

        const paginaConteudo = document.getElementById("pagina-conteudo");
        const botaoVoltar = document.getElementById("botao-voltar");
        const botaoAvancar = document.getElementById("botao-avancar");
        const paginacaoIndicador = document.getElementById("paginacao-indicador");
        const paginacaoNumeros = document.getElementById("paginacao-numeros");

        const flutuanteVoltar = document.getElementById("flutuante-voltar");
        const flutuanteAvancar = document.getElementById("flutuante-avancar");
        const flutuanteIndicador = document.getElementById("flutuante-indicador");

        const abrirMenu = document.getElementById("abrir-menu-navegacao");
        const fecharMenu = document.getElementById("fechar-menu-navegacao");
        const menuLateral = document.getElementById("menu-navegacao-lateral");
        const menuBackdrop = document.getElementById("menu-navegacao-backdrop");
        const menuLinks = document.querySelectorAll(".menu-link");

        const totalPaginas = paginasUnidade.length;
        let paginaAtual = 1;

        function limitarPagina(numero) {
            if (numero < 1) return 1;
            if (numero > totalPaginas) return totalPaginas;
            return numero;
        }

        function atualizarHashSemPulo(numeroPagina) {
            const novoHash = `pagina-${numeroPagina}`;
            history.replaceState(null, "", `#${novoHash}`);
        }

        function rolarParaConteudo() {
            const main = document.getElementById("conteudo-principal");
            const distanciaTopo = main.getBoundingClientRect().top + window.scrollY - 24;

            window.scrollTo({
                top: distanciaTopo,
                behavior: "smooth"
            });
        }

        function criarNumerosPaginacao() {
            paginacaoNumeros.innerHTML = "";

            paginasUnidade.forEach((pagina, index) => {
                const numero = index + 1;

                const botao = document.createElement("button");
                botao.type = "button";
                botao.className = "paginacao-numero";
                botao.textContent = numero;
                botao.setAttribute("aria-label", `Ir para a página ${numero}: ${pagina.titulo}`);

                botao.addEventListener("click", () => {
                    mudarPagina(numero);
                });

                paginacaoNumeros.appendChild(botao);
            });
        }

        function atualizarMenuLateral() {
            menuLinks.forEach((link) => {
                const paginaDoLink = Number(link.dataset.page);
                const estaAtual = paginaDoLink === paginaAtual;

                link.classList.toggle("is-current", estaAtual);

                if (estaAtual) {
                    link.setAttribute("aria-current", "page");
                } else {
                    link.removeAttribute("aria-current");
                }
            });
        }

        function atualizarPaginacao() {
            const botoesNumeros = document.querySelectorAll(".paginacao-numero");

            botoesNumeros.forEach((botao, index) => {
                const numero = index + 1;
                const estaAtual = numero === paginaAtual;

                botao.classList.toggle("is-active", estaAtual);

                if (estaAtual) {
                    botao.setAttribute("aria-current", "page");
                } else {
                    botao.removeAttribute("aria-current");
                }
            });

            paginacaoIndicador.textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            flutuanteIndicador.textContent = `Página ${paginaAtual}`;

            botaoVoltar.disabled = paginaAtual === 1;
            flutuanteVoltar.disabled = paginaAtual === 1;

            botaoAvancar.disabled = paginaAtual === totalPaginas;
            flutuanteAvancar.disabled = paginaAtual === totalPaginas;
        }

        function renderizarPagina() {
            const pagina = paginasUnidade[paginaAtual - 1];

            paginaConteudo.className = `pagina-conteudo ${pagina.classe}`;
            paginaConteudo.innerHTML = pagina.conteudo;

            document.title = `${pagina.titulo} | Unidade 1 | PICS para ACS e ACE`;

            atualizarPaginacao();
            atualizarMenuLateral();
            atualizarHashSemPulo(paginaAtual);
        }

        function mudarPagina(numeroPagina, deveRolar = true) {
            paginaAtual = limitarPagina(numeroPagina);
            renderizarPagina();

            if (deveRolar) {
                rolarParaConteudo();
            }
        }

        function abrirMenuLateral() {
            menuBackdrop.hidden = false;

            requestAnimationFrame(() => {
                menuBackdrop.classList.add("is-visible");
                menuLateral.classList.add("is-open");
            });

            menuLateral.setAttribute("aria-hidden", "false");
            abrirMenu.setAttribute("aria-expanded", "true");
            fecharMenu.focus();
        }

        function fecharMenuLateral() {
            menuBackdrop.classList.remove("is-visible");
            menuLateral.classList.remove("is-open");

            menuLateral.setAttribute("aria-hidden", "true");
            abrirMenu.setAttribute("aria-expanded", "false");

            setTimeout(() => {
                menuBackdrop.hidden = true;
            }, 250);

            abrirMenu.focus();
        }

        function obterPaginaPeloHash() {
            const hash = window.location.hash.replace("#pagina-", "");
            const numero = Number(hash);

            if (Number.isInteger(numero) && numero >= 1 && numero <= totalPaginas) {
                return numero;
            }

            return 1;
        }

        botaoVoltar.addEventListener("click", () => mudarPagina(paginaAtual - 1));
        botaoAvancar.addEventListener("click", () => mudarPagina(paginaAtual + 1));

        flutuanteVoltar.addEventListener("click", () => mudarPagina(paginaAtual - 1));
        flutuanteAvancar.addEventListener("click", () => mudarPagina(paginaAtual + 1));

        abrirMenu.addEventListener("click", abrirMenuLateral);
        fecharMenu.addEventListener("click", fecharMenuLateral);
        menuBackdrop.addEventListener("click", fecharMenuLateral);

        menuLinks.forEach((link) => {
            link.addEventListener("click", () => {
                const paginaDestino = Number(link.dataset.page);

                mudarPagina(paginaDestino);
                fecharMenuLateral();
            });
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && menuLateral.classList.contains("is-open")) {
                fecharMenuLateral();
            }

            if (event.key === "ArrowLeft" && paginaAtual > 1) {
                mudarPagina(paginaAtual - 1);
            }

            if (event.key === "ArrowRight" && paginaAtual < totalPaginas) {
                mudarPagina(paginaAtual + 1);
            }
        });

        window.addEventListener("hashchange", () => {
            const paginaHash = obterPaginaPeloHash();

            if (paginaHash !== paginaAtual) {
                mudarPagina(paginaHash, false);
            }
        });

        criarNumerosPaginacao();
        paginaAtual = obterPaginaPeloHash();
        renderizarPagina();
    </script>

    <script>
        /* =========================================================
           EFEITOS VISUAIS SEM SOMBRAS
           Substitui o JS extra anterior de animações
           ========================================================= */

        (function () {
            const usuarioPrefereMenosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            /*
                Remove restos do JS anterior:
                - estilos injetados com sombras
                - manchas/glows criados via mouse
                - sombras inline aplicadas por JavaScript
            */
            function limparEfeitosDeSombraDoJS() {
                const idsAntigos = [
                    "efeitos-visuais-js",
                    "efeitos-sombra-js",
                    "cursor-glow-js",
                    "mancha-verde-js"
                ];

                idsAntigos.forEach((id) => {
                    const elemento = document.getElementById(id);

                    if (elemento) {
                        elemento.remove();
                    }
                });

                document
                    .querySelectorAll(".cursor-glow, .cursor-aura, .mouse-glow, .mancha-verde, .glow-js, .sombra-js")
                    .forEach((elemento) => elemento.remove());

                document.querySelectorAll("*").forEach((elemento) => {
                    if (elemento.style.boxShadow) {
                        elemento.style.removeProperty("box-shadow");
                    }

                    if (elemento.style.textShadow) {
                        elemento.style.removeProperty("text-shadow");
                    }

                    const filtro = elemento.style.getPropertyValue("filter");

                    if (filtro && filtro.includes("drop-shadow")) {
                        elemento.style.removeProperty("filter");
                    }
                });
            }

            limparEfeitosDeSombraDoJS();

            if (usuarioPrefereMenosMovimento) {
                return;
            }

            const estilos = document.createElement("style");
            estilos.id = "efeitos-visuais-js";

            estilos.textContent = `
            .js-revelar {
                opacity: 0;
                transform: translateY(22px);
                transition:
                    opacity 0.55s ease,
                    transform 0.55s ease;
            }

            .js-revelar.is-visible {
                opacity: 1;
                transform: translateY(0);
            }

            .js-revelar-delay-1 {
                transition-delay: 0.06s;
            }

            .js-revelar-delay-2 {
                transition-delay: 0.12s;
            }

            .js-revelar-delay-3 {
                transition-delay: 0.18s;
            }

            .pagina-conteudo.js-troca-pagina {
                animation: jsTrocaPaginaSemSombra 0.42s ease both;
            }

            @keyframes jsTrocaPaginaSemSombra {
                from {
                    opacity: 0;
                    transform: translateY(18px) scale(0.985);
                }

                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .menu-navegacao-botao.js-respirar {
                animation: jsRespirarSemSombra 2.8s ease-in-out infinite;
            }

            @keyframes jsRespirarSemSombra {
                0%, 100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-3px);
                }
            }

            .paginacao-numero.js-batida {
                animation: jsBatidaSemSombra 0.28s ease both;
            }

            @keyframes jsBatidaSemSombra {
                0% {
                    transform: scale(1);
                }

                50% {
                    transform: scale(1.08);
                }

                100% {
                    transform: scale(1);
                }
            }

            .js-ripple {
                position: relative;
                overflow: hidden;
            }

            .js-ripple-circulo {
                position: absolute;
                width: 18px;
                height: 18px;

                background-color: rgba(79, 99, 61, 0.18);

                border-radius: 50%;

                pointer-events: none;

                transform: translate(-50%, -50%) scale(0);
                animation: jsRippleSemSombra 0.55s ease-out forwards;
            }

            @keyframes jsRippleSemSombra {
                to {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(4);
                }
            }

            .js-destaque-suave {
                transition:
                    transform 0.25s ease,
                    background-color 0.25s ease,
                    border-color 0.25s ease;
            }

            .js-destaque-suave:hover {
                transform: translateY(-4px);
            }

            .js-progressivo {
                transition:
                    opacity 0.35s ease,
                    transform 0.35s ease;
            }
        `;

            document.head.appendChild(estilos);

            const paginaConteudoJS = document.getElementById("pagina-conteudo");
            const botaoMenuJS = document.getElementById("abrir-menu-navegacao");

            if (botaoMenuJS) {
                botaoMenuJS.classList.add("js-respirar");
            }

            function prepararRevelacao(container = document) {
                const elementos = container.querySelectorAll(`
                #banner-conteudo-logo,
                #banner-conteudo-titulo,
                .pagina-conteudo h3,
                .pagina-conteudo h4,
                .pagina-conteudo p,
                .pagina-conteudo ul,
                .pagina-conteudo ol,
                .pagina-conteudo li,
                .acordo-imagem-item,
                .acordo-pilares li,
                .acordo-destaque,
                .acordo-cards-status article
            `);

                elementos.forEach((elemento, index) => {
                    if (elemento.classList.contains("js-revelar")) {
                        return;
                    }

                    elemento.classList.add("js-revelar");

                    const delay = index % 4;

                    if (delay > 0) {
                        elemento.classList.add(`js-revelar-delay-${delay}`);
                    }
                });
            }

            const observadorRevelacao = new IntersectionObserver(
                (entradas) => {
                    entradas.forEach((entrada) => {
                        if (entrada.isIntersecting) {
                            entrada.target.classList.add("is-visible");
                            observadorRevelacao.unobserve(entrada.target);
                        }
                    });
                },
                {
                    threshold: 0.12,
                    rootMargin: "0px 0px -40px 0px"
                }
            );

            function observarElementosRevelaveis(container = document) {
                container.querySelectorAll(".js-revelar:not(.is-visible)").forEach((elemento) => {
                    observadorRevelacao.observe(elemento);
                });
            }

            function animarTrocaDePagina() {
                if (!paginaConteudoJS) {
                    return;
                }

                paginaConteudoJS.classList.remove("js-troca-pagina");

                void paginaConteudoJS.offsetWidth;

                paginaConteudoJS.classList.add("js-troca-pagina");

                setTimeout(() => {
                    paginaConteudoJS.classList.remove("js-troca-pagina");
                }, 450);
            }

            function ativarRippleSemSombra() {
                document.querySelectorAll("button").forEach((botao) => {
                    if (botao.dataset.rippleAtivado === "true") {
                        return;
                    }

                    botao.dataset.rippleAtivado = "true";
                    botao.classList.add("js-ripple");

                    botao.addEventListener("click", (event) => {
                        const circuloAntigo = botao.querySelector(".js-ripple-circulo");

                        if (circuloAntigo) {
                            circuloAntigo.remove();
                        }

                        const circulo = document.createElement("span");
                        circulo.className = "js-ripple-circulo";

                        const posicao = botao.getBoundingClientRect();

                        circulo.style.left = `${event.clientX - posicao.left}px`;
                        circulo.style.top = `${event.clientY - posicao.top}px`;

                        botao.appendChild(circulo);

                        setTimeout(() => {
                            circulo.remove();
                        }, 600);
                    });
                });
            }

            function ativarDestaquesSemSombra(container = document) {
                const elementos = container.querySelectorAll(`
                .acordo-pilares li,
                .acordo-cards-status article,
                .acordo-destaque,
                .boas-vindas-texto-continuo li,
                .conhecendo-modulo-texto-continuo li,
                .paginacao-numero,
                .paginacao-botao
            `);

                elementos.forEach((elemento) => {
                    elemento.classList.add("js-destaque-suave");
                });
            }

            function atualizarAnimacoesDaPagina() {
                limparEfeitosDeSombraDoJS();

                prepararRevelacao(document);
                observarElementosRevelaveis(document);
                ativarRippleSemSombra();
                ativarDestaquesSemSombra(document);
            }

            atualizarAnimacoesDaPagina();

            if (paginaConteudoJS) {
                const observadorConteudo = new MutationObserver(() => {
                    animarTrocaDePagina();
                    atualizarAnimacoesDaPagina();
                });

                observadorConteudo.observe(paginaConteudoJS, {
                    childList: true,
                    subtree: true
                });
            }

            const observadorLimpeza = new MutationObserver(() => {
                limparEfeitosDeSombraDoJS();
            });

            observadorLimpeza.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["style", "class"]
            });
        })();
    </script>

    <script>
        /* =========================================================
           EFEITOS SIMPLES:
           1. Barra de progresso no topo ao rolar a página
           2. Movimento suave em alguns itens ao passar o mouse
           SEM sombras, SEM manchas, SEM glow
           ========================================================= */

        (function () {
            const prefereMenosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            const estiloAntigo = document.getElementById("efeitos-simples-js");

            if (estiloAntigo) {
                estiloAntigo.remove();
            }

            const estilos = document.createElement("style");
            estilos.id = "efeitos-simples-js";

            estilos.textContent = `
        body.js-barra-progresso::before {
            content: "";

            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;

            width: var(--progresso-scroll, 0%);
            height: 5px;

            background: linear-gradient(
                90deg,
                #a3cd6d,
                #4f633d,
                #735f20
            );

            pointer-events: none;

            transition: width 0.1s linear;
        }

        .js-hover-movimento {
            transition:
                transform 0.22s ease,
                background-color 0.22s ease,
                border-color 0.22s ease;
        }

        .js-hover-movimento:hover {
            transform: translateY(-4px);
        }

        .acordo-passos li.js-hover-movimento:hover,
        .acordo-regras li.js-hover-movimento:hover,
        .boas-vindas-texto-continuo li.js-hover-movimento:hover,
        .conhecendo-modulo-texto-continuo li.js-hover-movimento:hover,
        .menu-link.js-hover-movimento:hover {
            transform: translateX(6px);
        }

        .paginacao-botao.js-hover-movimento:hover:not(:disabled),
        .paginacao-numero.js-hover-movimento:hover,
        .controle-flutuante-pagina button.js-hover-movimento:hover:not(:disabled),
        .menu-navegacao-botao.js-hover-movimento:hover {
            transform: translateY(-3px);
        }

        @media (prefers-reduced-motion: reduce) {
            body.js-barra-progresso::before {
                display: none;
            }

            .js-hover-movimento,
            .js-hover-movimento:hover {
                transition: none !important;
                transform: none !important;
            }
        }
    `;

            document.head.appendChild(estilos);

            if (prefereMenosMovimento) {
                return;
            }

            document.body.classList.add("js-barra-progresso");

            function atualizarBarraDeProgresso() {
                const alturaTotal = document.documentElement.scrollHeight - window.innerHeight;
                const progresso = alturaTotal > 0 ? (window.scrollY / alturaTotal) * 100 : 0;

                document.body.style.setProperty(
                    "--progresso-scroll",
                    `${Math.min(progresso, 100)}%`
                );
            }

            function aplicarMovimentoHover(container = document) {
                const elementos = container.querySelectorAll(`
            .acordo-pilares li,
            .acordo-passos li,
            .acordo-regras li,
            .acordo-destaque,
            .acordo-cards-status article,
            .boas-vindas-texto-continuo li,
            .conhecendo-modulo-texto-continuo li,
            .paginacao-botao,
            .paginacao-numero,
            .controle-flutuante-pagina button,
            .menu-navegacao-botao,
            .menu-link
        `);

                elementos.forEach((elemento) => {
                    elemento.classList.add("js-hover-movimento");
                });
            }

            window.addEventListener("scroll", atualizarBarraDeProgresso, {
                passive: true
            });

            const paginaConteudo = document.getElementById("pagina-conteudo");

            if (paginaConteudo) {
                const observadorConteudo = new MutationObserver(() => {
                    aplicarMovimentoHover(document);
                });

                observadorConteudo.observe(paginaConteudo, {
                    childList: true,
                    subtree: true
                });
            }

            atualizarBarraDeProgresso();
            aplicarMovimentoHover(document);
        })();
    </script>

</body>
