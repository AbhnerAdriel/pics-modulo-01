        function calcularProgressoPagina(pagina, total) {

        function criarIndicadorProgressoPaginas(elemento) {
            if (!elemento) return null;

            const texto = elemento.querySelector("[data-progresso-paginas-texto]");
            const arco = elemento.querySelector(".progresso-circular-valor");

            return {
                atualizar(valor, descricao) {
                    const progresso = Math.max(0, Math.min(100, Math.round(valor)));

                    elemento.style.setProperty("--progresso-paginas-valor", progresso);
                    elemento.setAttribute("aria-valuenow", String(progresso));

                    if (arco) {
                        arco.style.strokeDashoffset = String(100 - progresso);

                    if (descricao) {
                        elemento.setAttribute("aria-valuetext", descricao);
                        elemento.setAttribute("aria-label", descricao);
                        elemento.title = descricao;
                    }

                    if (texto) {

        (function () {

            controleFlutuante.style.transition = controleFlutuante.style.transition || 'opacity 0.22s ease, transform 0.22s ease, visibility 0.22s';

            observer.observe(paginacaoContainer);
        })();
    </script>

    <script>
        /* =========================================================
           EFEITOS VISUAIS SEM SOMBRAS
           Substitui o JS extra anterior de animações
           ========================================================= */

        (function () {
            const usuarioPrefereMenosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            /*
                Remove restos do JS anterior:
                - estilos injetados com sombras
                - manchas/glows criados via mouse
                - sombras inline aplicadas por JavaScript
            */
            function limparEfeitosDeSombraDoJS() {
                const idsAntigos = [
                    "efeitos-visuais-js",
                    "efeitos-sombra-js",
                    "cursor-glow-js",
                    "mancha-verde-js"
                ];

                idsAntigos.forEach((id) => {
                    const elemento = document.getElementById(id);

                    if (elemento) {
                        elemento.remove();
                    }
                });

                document
                    .querySelectorAll(".cursor-glow, .cursor-aura, .mouse-glow, .mancha-verde, .glow-js, .sombra-js")
                    .forEach((elemento) => elemento.remove());

                document.querySelectorAll("*").forEach((elemento) => {
                    if (elemento.style.boxShadow) {
                        elemento.style.removeProperty("box-shadow");
                    }

                    if (elemento.style.textShadow) {
                        elemento.style.removeProperty("text-shadow");
                    }

                    const filtro = elemento.style.getPropertyValue("filter");

                    if (filtro && filtro.includes("drop-shadow")) {
                        elemento.style.removeProperty("filter");
                    }
                });
            }

            limparEfeitosDeSombraDoJS();

            if (usuarioPrefereMenosMovimento) {
                return;
            }

            const estilos = document.createElement("style");
            estilos.id = "efeitos-visuais-conteudo-js";

            estilos.textContent = `
            .menu-navegacao-botao.js-respirar {
                animation: jsRespirarSemSombra 2.8s ease-in-out infinite;
            }

            @keyframes jsRespirarSemSombra {
                0%, 100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-3px);
                }
            }

            .paginacao-numero.js-batida {
                animation: jsBatidaSemSombra 0.28s ease both;
            }

            @keyframes jsBatidaSemSombra {
                0% {
                    transform: scale(1);
                }

                50% {
                    transform: scale(1.08);
                }

                100% {
                    transform: scale(1);
                }
            }

            .js-ripple {
                position: relative;
                overflow: hidden;
            }

            .js-ripple-circulo {
                position: absolute;
                width: 18px;
                height: 18px;

                background-color: rgba(79, 99, 61, 0.18);

                border-radius: 50%;

                pointer-events: none;

                transform: translate(-50%, -50%) scale(0);
                animation: jsRippleSemSombra 0.55s ease-out forwards;
            }

            @keyframes jsRippleSemSombra {
                to {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(4);
                }
            }

            .js-destaque-suave {
                transition:
                    transform 0.25s ease,
                    background-color 0.25s ease,
                    border-color 0.25s ease;
            }

            .js-destaque-suave:hover {
                transform: translateY(-4px);
            }

            .js-progressivo {
                transition:
                    opacity 0.35s ease,
                    transform 0.35s ease;
            }
        `;

            document.head.appendChild(estilos);

            const paginaConteudoJS = document.getElementById("pagina-conteudo");
            const botaoMenuJS = document.getElementById("abrir-menu-navegacao");

            if (botaoMenuJS) {
                botaoMenuJS.classList.add("js-respirar");
            }

            function ativarRippleSemSombra() {
                document.querySelectorAll(".faq-pergunta").forEach((botaoFaq) => {
                    botaoFaq.classList.remove("js-ripple");
                    botaoFaq.removeAttribute("data-ripple-ativado");
                    botaoFaq.querySelectorAll(".js-ripple-circulo").forEach((circulo) => circulo.remove());
                });

                document.querySelectorAll("button:not(.faq-pergunta)").forEach((botao) => {
                    if (botao.dataset.rippleAtivado === "true") {
                        return;
                    }

                    botao.dataset.rippleAtivado = "true";
                    botao.classList.add("js-ripple");

                    botao.addEventListener("click", (event) => {
                        const circuloAntigo = botao.querySelector(".js-ripple-circulo");

                        if (circuloAntigo) {
                            circuloAntigo.remove();
                        }

                        const circulo = document.createElement("span");
                        circulo.className = "js-ripple-circulo";

                        const posicao = botao.getBoundingClientRect();

                        circulo.style.left = `${event.clientX - posicao.left}px`;
                        circulo.style.top = `${event.clientY - posicao.top}px`;

                        botao.appendChild(circulo);

                        setTimeout(() => {
                            circulo.remove();
                        }, 600);
                    });
                });
            }

            function ativarDestaquesSemSombra(container = document) {
                const elementos = container.querySelectorAll(`
                .acordo-pilares li,
                .acordo-cards-status article,
                .acordo-destaque,
                .boas-vindas-texto-continuo li,
                .conhecendo-modulo-texto-continuo li,
                .paginacao-numero,
                .paginacao-botao
            `);

                elementos.forEach((elemento) => {
                    elemento.classList.add("js-destaque-suave");
                });
            }

            function atualizarAnimacoesDaPagina() {
                limparEfeitosDeSombraDoJS();

                ativarRippleSemSombra();
                ativarDestaquesSemSombra(document);
            }

            atualizarAnimacoesDaPagina();

            if (paginaConteudoJS) {
                const observadorConteudo = new MutationObserver(() => {
                    atualizarAnimacoesDaPagina();
                });

                observadorConteudo.observe(paginaConteudoJS, {
                    childList: true,
                    subtree: true
                });
            }

            const observadorLimpeza = new MutationObserver(() => {
                limparEfeitosDeSombraDoJS();
            });

            observadorLimpeza.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["style", "class"]
            });
        })();
    </script>

    <script>
        /* =========================================================
           EFEITOS SIMPLES:
           1. Barra de progresso no topo ao rolar a página
           2. Movimento suave em alguns itens ao passar o mouse
           SEM sombras, SEM manchas, SEM glow
           ========================================================= */

        (function () {
            const prefereMenosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            const estiloAntigo = document.getElementById("efeitos-simples-js");

            if (estiloAntigo) {
                estiloAntigo.remove();
            }

            const estilos = document.createElement("style");
            estilos.id = "efeitos-simples-js";

            estilos.textContent = `
        body.js-barra-progresso::before {
            content: "";

            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;

            width: var(--progresso-scroll, 0%);
            height: 5px;

            background: linear-gradient(90deg, #4f633d, #735f20);

            pointer-events: none;

            transition: width 0.1s linear;
        }

        .js-hover-movimento {
            transition:
                transform 0.22s ease,
                background-color 0.22s ease,
                border-color 0.22s ease;
        }

        .js-hover-movimento:hover {
            transform: translateY(-4px);
        }

        .acordo-passos li.js-hover-movimento:hover,
        .acordo-regras li.js-hover-movimento:hover,
        .boas-vindas-texto-continuo li.js-hover-movimento:hover,
        .conhecendo-modulo-texto-continuo li.js-hover-movimento:hover,
        .menu-link.js-hover-movimento:hover {
            transform: translateX(6px);
        }

        .paginacao-botao.js-hover-movimento:hover:not(:disabled),
        .paginacao-numero.js-hover-movimento:hover,
        .controle-flutuante-pagina button.js-hover-movimento:hover:not(:disabled),
        .menu-navegacao-botao.js-hover-movimento:hover {
            transform: translateY(-3px);
        }

        @media (prefers-reduced-motion: reduce) {
            body.js-barra-progresso::before {
                display: none;
            }

            .js-hover-movimento,
            .js-hover-movimento:hover {
                transition: none !important;
                transform: none !important;
            }
        }
    `;

            document.head.appendChild(estilos);

            if (prefereMenosMovimento) {
                return;
            }

            document.body.classList.add("js-barra-progresso");

            function atualizarBarraDeProgresso() {
                const alturaTotal = document.documentElement.scrollHeight - window.innerHeight;
                const progresso = alturaTotal > 0 ? (window.scrollY / alturaTotal) * 100 : 0;

                document.body.style.setProperty(
                    "--progresso-scroll",
                    `${Math.min(progresso, 100)}%`
                );
            }

            function aplicarMovimentoHover(container = document) {
                const elementos = container.querySelectorAll(`
            .acordo-pilares li,
            .acordo-passos li,
            .acordo-regras li,
            .acordo-destaque,
            .acordo-cards-status article,
            .boas-vindas-texto-continuo li,
            .conhecendo-modulo-texto-continuo li,
            .paginacao-botao,
            .paginacao-numero,
            .controle-flutuante-pagina button,
            .menu-navegacao-botao,
            .menu-link
        `);

                elementos.forEach((elemento) => {
                    elemento.classList.add("js-hover-movimento");
                });
            }

            window.addEventListener("scroll", atualizarBarraDeProgresso, {
                passive: true
            });

            const paginaConteudo = document.getElementById("pagina-conteudo");

            if (paginaConteudo) {
                const observadorConteudo = new MutationObserver(() => {
                    aplicarMovimentoHover(document);
                });

                observadorConteudo.observe(paginaConteudo, {
                    childList: true,
                    subtree: true
                });
            }

            atualizarBarraDeProgresso();
            aplicarMovimentoHover(document);
        })();
    </script>

</body>

</html>
